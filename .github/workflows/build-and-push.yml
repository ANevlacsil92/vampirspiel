name: Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Kein Fallback auf npm install: schlägt npm ci fehl, ist das Lockfile
      # kaputt oder unvollständig, und der Docker-Build scheitert später sowieso.
      - run: npm ci --no-audit --no-fund

      - run: npm run build

      # Beide Suiten starten den gebauten Server selbst und beenden ihn wieder.
      - run: npm test
      - run: npm run test:restart

  push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.host }}
          username: ${{ secrets.admin }}
          password: ${{ secrets.password }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # WICHTIG: nur der Image-Name, KEIN Tag. Die Tags kommen aus dem
          # tags-Block unten und werden angehaengt. Steht hier ":latest" mit
          # drin, entsteht "host/vampirspiel:latest:latest" - zwei Doppelpunkte,
          # kein gueltiger Image-Reference, und der Push bricht ab.
          images: ${{ secrets.host }}/vampirspiel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Laeuft auf x86-Proxmox. Fuer ARM zusaetzlich linux/arm64 eintragen -
          # das Lockfile hat die Bindings fuer beide.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max